    <style>
      /* 下面样式基本保持你原来的（去掉了登录/账号部分用不到也没关系） */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container { max-width: 1400px; margin: 0 auto; }
      header {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      header h1 { font-size: 28px; color: #667eea; }

      .header-actions { display: flex; gap: 10px; align-items: center; }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.3s;
      }
      button:hover { background: #764ba2; }

      .section {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .section h2 {
        font-size: 20px;
        color: #333;
        margin-bottom: 16px;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .screenshots-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .screenshot-card {
        background: #f8f9fa;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        border: 1px solid #e0e7ff;
      }
      .screenshot-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
      }
      .screenshot-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        cursor: pointer;
        background: #f0f0f0;
      }
      .screenshot-info { padding: 16px; }
      .screenshot-username { font-weight: 600; color: #333; margin-bottom: 8px; }
      .screenshot-time { font-size: 14px; color: #666; margin-bottom: 12px; }

      .status-message {
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
        display: none;
      }
      .status-message.success {
        background: #dcfce7; color: #166534; border: 1px solid #86efac;
      }
      .status-message.error {
        background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;
      }
      .status-message.active { display: block; }

      .loading { text-align: center; padding: 40px; color: #667eea; }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }

      .empty-state { text-align: center; padding: 40px 20px; color: #999; }

      .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal.active { display: flex; }
      .modal-content {
        background: white;
        border-radius: 12px;
        max-width: 900px;
        max-height: 90vh;
        overflow: auto;
        padding: 20px;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: transparent;
        color: #999;
        font-size: 24px;
        padding: 0;
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }
      .modal-image {
        width: 100%;
        max-height: 75vh;
        object-fit: contain;
        border-radius: 8px;
      }

      @media (max-width: 768px) {
        header { flex-direction: column; align-items: flex-start; }
        .screenshots-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>📹 TikTok Live Screenshots</h1>
        <div class="header-actions">
          <button id="refreshBtn">Refresh</button>
        </div>
      </header>

      <div class="section">
        <h2>Screenshots</h2>
        <div class="status-message" id="status"></div>
        <div id="screens">
          <div class="loading">
            <div class="spinner"></div>
            Loading screenshots...
          </div>
        </div>
      </div>
    </div>

    <!-- Image preview modal -->
    <div id="imageModal" class="modal">
      <div class="modal-content">
        <button id="modalClose" class="modal-close">×</button>
        <img id="modalImage" class="modal-image" />
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
